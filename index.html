<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <title>English Quiz</title>


<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
}

body {
    font-family: Arial, sans-serif;
    background: #f2f4f7;
    color: #202124;

    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
}


/* ==========================================
   MAIN QUIZ CONTAINER
   ========================================== */

.quiz {
    width: 100%;
    max-width: 700px;

    margin: 0 auto;

    padding:
        max(18px, env(safe-area-inset-top))
        16px
        max(40px, env(safe-area-inset-bottom));
}


/* ==========================================
   PROGRESS
   ========================================== */

#progress {
    font-size: 16px;
    line-height: 1.4;

    color: #6b7280;

    margin-bottom: 8px;

    font-weight: 600;
}


/* ==========================================
   SCORE
   ========================================== */

#score {
    font-size: 19px;
    line-height: 1.4;

    color: #1f2937;

    font-weight: bold;

    margin-bottom: 26px;
}


/* ==========================================
   QUESTION
   ========================================== */

#question {
    font-size: 22px;
    line-height: 1.55;

    font-weight: 700;

    color: #111827;

    margin-bottom: 25px;

    word-wrap: break-word;
    overflow-wrap: break-word;
}


/* ==========================================
   OPTIONS
   ========================================== */

#options {
    width: 100%;
}

.option {
    display: block;

    width: 88%;
    margin-left: 0;
    margin-right: auto;

    min-height: 58px;

    padding: 15px 17px;

    margin-bottom: 13px;

    font-family: Arial, sans-serif;

    font-size: 21px;
    font-weight: 500;
    line-height: 1.35;

    text-align: left;

    color: #1f2937;

    background: #ffffff;

    border: 2px solid #d1d5db;

    border-radius: 12px;

    cursor: pointer;

    touch-action: manipulation;

    -webkit-appearance: none;

    transition:
        background-color 0.15s,
        border-color 0.15s,
        transform 0.1s;
}


/* Touch feedback */

.option:active {
    background: #eef2ff;
    transform: scale(0.99);
}


/* Correct answer */

.option.correct {
    color: #166534;

    background: #dcfce7;

    border-color: #22c55e;
}


/* Wrong answer */

.option.wrong {
    color: #991b1b;

    background: #fee2e2;

    border-color: #ef4444;
}


/* ==========================================
   FEEDBACK
   ========================================== */

#feedback {
    min-height: 30px;

    margin-top: 18px;

    font-size: 21px;
    line-height: 1.4;

    font-weight: bold;

    color: #374151;
}


/* ==========================================
   NAVIGATION
   ========================================== */

.navigation {
    display: flex;

    justify-content: flex-start;

    gap: 12px;

    margin-top: 12px;

    width: 100%;
}

.navigation button {
    flex: 0 0 auto;

    min-width: 125px;
    min-height: 54px;

    padding: 14px 18px;

    font-family: Arial, sans-serif;

    font-size: 18px;

    font-weight: bold;

    border: none;

    border-radius: 12px;

    cursor: pointer;

    touch-action: manipulation;
}


/* Previous */

#prevButton {
    color: #374151;
    background: #e5e7eb;
}


/* Next, if used later */

#nextButton {
    color: white;
    background: #2563eb;
}


/* Remove old unused button rules */

#prevBtn,
#nextBtn {
    width: auto;
    height: auto;
}


.navigation button:active {
    transform: scale(0.98);
}


.navigation button:disabled {
    opacity: 0.45;
    cursor: default;
}


/* ==========================================
   FINAL RESULT
   ========================================== */

#result {
    width: 100%;

    text-align: center;

    font-size: 23px;

    font-weight: bold;

    color: #111827;

    margin-top: 45px;

    line-height: 1.7;

    overflow-wrap: break-word;
}


/* ==========================================
   RESTART BUTTON
   ========================================== */

#restartButton {
    display: none;

    width: 100%;

    max-width: 400px;

    min-height: 56px;

    margin: 30px auto 0;

    padding: 15px 18px;

    font-family: Arial, sans-serif;

    font-size: 18px;

    font-weight: bold;

    color: white;

    background: #2563eb;

    border: none;

    border-radius: 12px;

    cursor: pointer;

    touch-action: manipulation;
}


#restartButton:active {
    background: #1d4ed8;

    transform: scale(0.98);
}


/* ==========================================
   INFO POPUP
   ========================================== */

#infoOverlay {
    display: none;

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    background: rgba(17, 24, 39, 0.55);

    align-items: flex-end;
    justify-content: center;

    padding:
        12px
        12px
        max(12px, env(safe-area-inset-bottom));

    z-index: 1000;
}


#infoOverlay.visible {
    display: flex;
}


/* ==========================================
   INFO BOX
   ========================================== */

#infoBox {
    width: 100%;

    max-width: 520px;

    max-height: 78vh;

    overflow-y: auto;

    -webkit-overflow-scrolling: touch;

    background: #ffffff;

    border-radius: 18px;

    padding: 22px 20px;

    margin: 0;

    box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.25);
}


/* ==========================================
   POPUP WORD
   ========================================== */

#infoWord {
    font-size: 24px;

    line-height: 1.3;

    font-weight: 700;

    color: #111827;

    margin-bottom: 14px;

    overflow-wrap: break-word;
}


/* ==========================================
   POPUP MEANING
   ========================================== */

#infoMeaning {
    font-size: 18px;

    line-height: 1.55;

    color: #1f2937;

    margin-bottom: 15px;

    overflow-wrap: break-word;
}


#infoMeaning span.label {
    font-weight: bold;

    color: #374151;
}


/* ==========================================
   POPUP EXAMPLE
   ========================================== */

#infoExample {
    font-size: 17px;

    line-height: 1.55;

    color: #4b5563;

    font-style: italic;

    margin-bottom: 20px;

    overflow-wrap: break-word;
}


#infoExample span.label {
    font-weight: bold;

    font-style: normal;

    color: #374151;
}


/* ==========================================
   GOT IT BUTTON
   ========================================== */

#infoCloseButton {
    width: 100%;

    min-height: 54px;

    font-family: Arial, sans-serif;

    font-size: 18px;

    font-weight: bold;

    color: white;

    background: #2563eb;

    border: none;

    border-radius: 11px;

    cursor: pointer;

    touch-action: manipulation;
}


#infoCloseButton:active {
    background: #1d4ed8;

    transform: scale(0.98);
}


/* ==========================================
   SMALL ANDROID PHONES
   ========================================== */

@media (max-width: 380px) {

    .quiz {
        padding-left: 13px;
        padding-right: 13px;
    }

    #question {
        font-size: 20px;
        line-height: 1.5;
    }

    .option {
        font-size: 17px;
        min-height: 60px;
        padding: 16px;
    }

    #score {
        font-size: 18px;
    }

    #progress {
        font-size: 15px;
    }

    #infoBox {
        padding: 20px 17px;
        max-height: 80vh;
    }

    #infoWord {
        font-size: 22px;
    }

    #infoMeaning {
        font-size: 17px;
    }

    #infoExample {
        font-size: 16px;
    }
}


/* ==========================================
   TABLET / LARGE SCREEN
   ========================================== */

@media (min-width: 600px) {

    .quiz {
        padding-top: 35px;
    }

    #question {
        font-size: 25px;
    }

    .option {
        font-size: 20px;
        min-height: 64px;
    }

    #infoBox {
        max-width: 500px;
    }
}


/* ==========================================
   LANDSCAPE PHONE
   ========================================== */

@media (max-height: 500px) and (orientation: landscape) {

    .quiz {
        padding-top: 12px;
        padding-bottom: 25px;
    }

    #score {
        margin-bottom: 15px;
    }

    #question {
        margin-bottom: 15px;
    }

    .option {
        min-height: 50px;
        padding: 12px 16px;
        margin-bottom: 9px;
    }

    #infoBox {
        max-height: 90vh;
    }
}

</style>
</head>


<body>


<div class="quiz">

</div>

    swipe: {
        meaning: "to hit or strike hard",
        example: "The player swiped at the ball but missed."
    },

    swirl: {
        meaning: "to move around in a twisting circular motion; a circular or twisting movement",
        example: "The leaves swirled around in the wind."
    },

    swivel: {
        meaning: "to turn or rotate around a fixed point; a device that allows something to rotate",
        example: "She swivelled around in her chair to face him."
    },

    swoop: {
        meaning: "to move or fly down suddenly to attack or seize something; a sudden downward attack or movement",
        example: "The eagle swooped down and caught the fish."
    },

    syndrome: {
        meaning: "a group of medical signs or symptoms that occur together",
        example: "The doctor recognized the symptoms as part of a rare syndrome."
    },

    synopsis: {
        meaning: "a brief summary of a book, play, film, or other work",
        example: "The publisher asked the author to provide a brief synopsis of the novel."
    },

    synoptic: {
        meaning: "giving a brief general summary or overview",
        example: "The report provides a synoptic view of the country's economic situation."
    },

    syphilis: {
        meaning: "a sexually transmitted infection caused by bacteria",
        example: "The clinic offers confidential testing for syphilis and other infections."
    }
};

// ======================================================
// SHUFFLE FUNCTION
// ======================================================

function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
}


// ======================================================
// GENERATE 100 RANDOM QUIZ QUESTIONS
// ======================================================

function generateQuizQuestions(numberOfQuestions = 100) {

    const allWords = Object.entries(vocabulary);

    // Randomly select vocabulary items
    const selectedWords = shuffle([...allWords])
        .slice(0, Math.min(numberOfQuestions, allWords.length));

    const questions = selectedWords.map(([word, entry]) => {

        // Get three other words as distractors
        const otherWords = allWords
            .filter(([w]) => w !== word)
            .map(([w]) => w);

        // Randomly select 3 distractors
        const distractors = shuffle([...otherWords])
            .slice(0, 3);

        // Create four choices
        const options = [
            word,
            ...distractors
        ];

        // Shuffle the four choices
        shuffle(options);

        // Find the correct answer
        const answerIndex = options.indexOf(word);

        const answerLetter =
            String.fromCharCode(65 + answerIndex);

        // Get meaning and example
        const meaning = entry.meaning;
        const example = entry.example;

        return `${meaning}
A. ${options[0]}
B. ${options[1]}
C. ${options[2]}
D. ${options[3]}
Answer: ${answerLetter}
Meaning: ${meaning}
Example: ${example}`;

    });

    return questions.join("\n\n");
}

// Generate exactly 100 questions
const questionText = generateQuizQuestions(100);function parseQuestions(text) {

    // Normalize line breaks

    text = text.replace(/\r\n/g, "\n");


    // Split questions at blank lines

    const blocks = text
        .trim()
        .split(/\n\s*\n/);


    const questions = [];


    blocks.forEach(function(block) {

        const lines = block
            .split("\n")
            .map(line => line.trim())
            .filter(line => line !== "");


        if (lines.length < 6) {
            return;
        }


        // ----------------------------------------------
        // Question
        // ----------------------------------------------

        const question = lines[0];


        // ----------------------------------------------
        // Options
        // ----------------------------------------------

        const options = [];

        for (let i = 1; i <= 4; i++) {

            let option = lines[i];


            // Remove A. B. C. D.
            // Also accepts A. option, A) option, etc.

            option = option.replace(
                /^[A-Da-d]\s*[\.\)]\s*/,
                ""
            );


            options.push(option);

        }


        // ----------------------------------------------
        // Answer
        // ----------------------------------------------

        const answerLine = lines[5];


        const match = answerLine.match(
            /Answer\s*:\s*([A-Da-d1-4])/i
        );


        if (!match) {
            console.warn(
                "Could not find answer:",
                answerLine
            );

            return;
        }


        const answerValue =
            match[1].toUpperCase();


        let answer;


        // If answer is A/B/C/D

        if (
            answerValue === "A" ||
            answerValue === "B" ||
            answerValue === "C" ||
            answerValue === "D"
        ) {

            answer =
                answerValue.charCodeAt(0) -
                "A".charCodeAt(0) +
                1;

        }


        // If answer is 1/2/3/4

        else {

            answer =
                parseInt(answerValue);

        }


        // ----------------------------------------------
        // Optional Meaning / Example lines
        // ----------------------------------------------

        let meaning = "";
        let example = "";

        for (let i = 6; i < lines.length; i++) {

            const meaningMatch = lines[i].match(
                /^Meaning\s*:\s*(.+)$/i
            );

            const exampleMatch = lines[i].match(
                /^Example\s*:\s*(.+)$/i
            );

            if (meaningMatch) {
                meaning = meaningMatch[1];
            } else if (exampleMatch) {
                example = exampleMatch[1];
            }

        }


        questions.push({

            question: question,

            options: options,

            answer: answer,

            meaning: meaning,

            example: example

        });

    });


    return questions;

}


// ======================================================
// CREATE QUESTION ARRAY
// ======================================================

const questions =
    parseQuestions(questionText);


// ======================================================
// VARIABLES
// ======================================================

let currentQuestion = 0;
let correctAnswers = 0;
let score = 0;

// ======================================================
// DISPLAY QUESTION
// ======================================================

function displayQuestion() {

    document.querySelector(".navigation").style.display =
        "flex";

    const question = questions[currentQuestion];

    // Question number
    document.getElementById("progress").textContent =
        "Question " +
        (currentQuestion + 1) +
        " / " +
        questions.length;

    // Current score
    document.getElementById("score").textContent =
        "Score: " +
        score;

    // Display question
    document.getElementById("question").textContent =
        question.question;

    // Clear old options
    const optionsDiv =
        document.getElementById("options");

    optionsDiv.innerHTML = "";

    // Clear feedback
    document.getElementById("feedback").textContent = "";

    // Create buttons
    question.options.forEach(function(option, index) {

        const button =
            document.createElement("button");

        button.className = "option";

        button.textContent =
            String.fromCharCode(65 + index) +
            ". " +
            option;

        button.addEventListener(
            "click",
            function() {
                checkAnswer(index, button);
            }
        );

        optionsDiv.appendChild(button);
    });

    // Previous button
    document.getElementById("prevButton").disabled =
        currentQuestion === 0;
}


// ======================================================
// CHECK ANSWER
// ======================================================

function checkAnswer(selectedIndex, button) {

    const question =
        questions[currentQuestion];

    // Prevent answering the same question twice
    const buttons =
        document.querySelectorAll(".option");

    buttons.forEach(function(btn) {
        btn.disabled = true;
    });

    // Correct answer
    if (selectedIndex + 1 === question.answer) {

        correctAnswers++;
        score += 1;

        button.classList.add("correct");

        document.getElementById("feedback").textContent =
            "Correct!";

        // Automatically move on after a short pause
        setTimeout(goToNextOrFinish, 900);
    }

    // Wrong answer
    else {

        button.classList.add("wrong");

        // Show the correct answer
        buttons[
            question.answer - 1
        ].classList.add("correct");

        document.getElementById("feedback").textContent =
            "Wrong.";

        // Show the info popup for the correct answer
        showInfo(question);
    }

    // Update score
    document.getElementById("score").textContent =
        "Score: " +
        score;
}

// ======================================================
// SHOW / CLOSE INFO POPUP
// ======================================================

function showInfo(question) {

    const correctOption =
        question.options[question.answer - 1];

    document.getElementById("infoWord").textContent =
        correctOption;

    document.getElementById("infoMeaning").innerHTML =
        question.meaning
            ? "<span class='label'>Meaning: </span>" + question.meaning
            : "";

    document.getElementById("infoExample").innerHTML =
        question.example
            ? "<span class='label'>Example: </span>" + question.example
            : "";

    document.getElementById("infoOverlay").classList.add("visible");
}


function closeInfo() {

    document.getElementById("infoOverlay").classList.remove("visible");

    // Automatically move on once the popup is dismissed
    goToNextOrFinish();
}


// ======================================================
// PREVIOUS QUESTION
// ======================================================

function previousQuestion() {

    if (currentQuestion > 0) {

        currentQuestion--;

        displayQuestion();
    }
}


// ======================================================
// GO TO NEXT QUESTION (OR FINISH)
// ======================================================

function goToNextOrFinish() {

    if (currentQuestion < questions.length - 1) {

        currentQuestion++;

        displayQuestion();
    }

    else {

        showResult();
    }
}


// ======================================================
// RESTART QUIZ
// ======================================================

function restartQuiz() {

currentQuestion = 0;

correctAnswers = 0;

score = 0;

document.getElementById("result").innerHTML = "";

document.getElementById("restartButton").style.display =
    "none";

displayQuestion();
}

// ======================================================
// SHOW FINAL RESULT
// ======================================================

function showResult() {

const totalQuestions = questions.length;

const percentage =
    (correctAnswers / totalQuestions) * 100;

const mark =
    percentage.toFixed(2);

// Clear quiz
document.getElementById("progress").textContent = "";
document.getElementById("score").textContent = "";
document.getElementById("question").textContent = "";
document.getElementById("options").innerHTML = "";
document.getElementById("feedback").textContent = "";

document.querySelector(".navigation").style.display =
    "none";

document.getElementById("restartButton").style.display =
    "block";

// Display result
document.getElementById("result").innerHTML =

    "Quiz Finished!<br><br>" +

    "Correct answers: " +
    correctAnswers +
    " / " +
    totalQuestions +

    "<br><br>" +

    "Score: " +
    score +
    " / " +
totalQuestions +

    "<br><br>" +

    "Mark: " +
    mark +
    " / 100";
}

// ======================================================
// START QUIZ
// ======================================================

if (questions.length > 0) {

    displayQuestion();

}

else {

    document.getElementById("question").textContent =
        "No questions found.";

}


</script>
